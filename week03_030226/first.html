<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LUNA Thrift</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Promo -->
<p class="text-center fw-light my-2">
    Get 10% off on <u>Sign Up</u>
</p>

<!-- Header -->
<div class="container-fluid d-flex align-items-center justify-content-between">

    <!-- Left: Logo -->
    <span style="font-family:'Anton', sans-serif; font-size:28px; font-weight:900;letter-spacing: 0.5ch;margin-left: 50px;">
        LUNA
    </span>

    <!-- Center: Menu -->
    <div class="d-flex gap-4">
        <span>Women</span>
        <span>Men</span>
        <span>Kids</span>
        <span>Accessories</span>
    </div>

    <!-- Right: Search -->
    <form class="d-flex">
        <input class="form-control me-2" type="search" placeholder="Search">
        <button class="btn btn-outline-success">Search</button>
    </form>

</div>
<div id="carouselExample" 
     class="carousel slide" 
     data-bs-ride="carousel"
     style="height:450px; overflow:hidden;">

  <div class="carousel-inner h-100">

    <div class="carousel-item active h-100">
      <img src=https://cdn.cosmos.so/fefae4fa-6142-4f31-8fed-0e05cb3afe88?format=jpeg
           class="w-100 h-100"
           style="object-fit:cover;">
    </div>

    <div class="carousel-item h-100">
      <img src=https://cdn.cosmos.so/0adb7748-c888-4902-921c-ac2aa89a6354?format=jpeg
           class="w-100 h-100"
           style="object-fit:cover;">
    </div>

    <div class="carousel-item h-100">
      <img src=https://cdn.cosmos.so/1369b0c3-f256-474e-a678-214e9241733c?format=jpeg
           class="w-100 h-100"
           style="object-fit:cover;">
    </div>

  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
  <span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
  <span class="carousel-control-next-icon"></span>
</button>

</div>
<br><br><br><br><br><br><br><br><br><br><br><br>

  <span style="font-family: 'Anton',serif;text-align: left;margin-left: 25px;font-size: 50px;">What's new at Luna</span>
