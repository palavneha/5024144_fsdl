<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LUNA Thrift</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Promo -->
<p class="text-center fw-light my-2">
Get 10% off on <u>Sign Up</u>
</p>

<!-- ================= NAVBAR (same design) ================= -->
<nav class="navbar container-fluid d-flex align-items-center justify-content-between">

<span style="font-family:'Anton'; font-size:28px; font-weight:900;letter-spacing: 0.5ch;margin-left:50px;">
LUNA
</span>

<div class="d-flex gap-4">
<span>Women</span>
<span>Men</span>
<span>Kids</span>
<span>Accessories</span>
</div>

<form class="d-flex">
<input class="form-control me-2" type="search" placeholder="Search">
<button class="btn btn-outline-success">Search</button>
</form>

</nav>

<!-- ================= BREADCRUMB ================= -->
<div class="container mt-2">
<ol class="breadcrumb">
<li class="breadcrumb-item">Home</li>
<li class="breadcrumb-item">Luna</li>
<li class="breadcrumb-item active">New</li>
</ol>
</div>

<!-- ================= JUMBOTRON (very simple, matches style) ================= -->
<div class="container-fluid text-center py-4">
<h2 style="font-family:'Anton';letter-spacing:3px;">LUNA THRIFT</h2>
<p class="fw-light">Sustainable fashion store</p>
<button class="btn btn-dark btn-sm">Shop Now</button>
</div>

<!-- ================= CAROUSEL (UNCHANGED) ================= -->
<div id="carouselExample" 
class="carousel slide" 
data-bs-ride="carousel"
style="height:450px; overflow:hidden;">

<div class="carousel-inner h-100">

<div class="carousel-item active h-100">
<img src="https://cdn.cosmos.so/fefae4fa-6142-4f31-8fed-0e05cb3afe88?format=jpeg"
class="w-100 h-100"
style="object-fit:cover;">
</div>

<div class="carousel-item h-100">
<img src="https://cdn.cosmos.so/0adb7748-c888-4902-921c-ac2aa89a6354?format=jpeg"
class="w-100 h-100"
style="object-fit:cover;">
</div>

<div class="carousel-item h-100">
<img src="https://cdn.cosmos.so/1369b0c3-f256-474e-a678-214e9241733c?format=jpeg"
class="w-100 h-100"
style="object-fit:cover;">
</div>

</div>

<button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>

<!-- ================= TITLE ================= -->
<div class="mt-5">
<span style="font-family:'Anton';margin-left:25px;font-size:50px;">
What's new at Luna
</span>
</div>

<!-- ================= GRID SYSTEM (UNCHANGED LOOK) ================= -->
<div class="container-fluid mt-4">
<div class="row text-center">

<div class="col-lg-3 col-md-6 col-12">
<img src="https://cdn.cosmos.so/b0a865ce-4c5e-4eb4-bdc9-2ce60acb56fc?format=jpeg"
style="width:100%; height:300px; object-fit:cover;">
<p class="mt-2">Wunder Train</p>
<button class="btn btn-outline-dark btn-sm">View</button>
</div>

<div class="col-lg-3 col-md-6 col-12">
<img src="https://cdn.cosmos.so/4a982e03-db77-46b1-b92c-1208f246d970?format=jpeg"
style="width:100%; height:300px; object-fit:cover;">
<p class="mt-2">BeCalm</p>
<button class="btn btn-outline-dark btn-sm">View</button>
</div>

<div class="col-lg-3 col-md-6 col-12">
<img src="https://cdn.cosmos.so/5cb62356-746c-4ea3-a174-608ab5f83db7?format=jpeg"
style="width:100%; height:300px; object-fit:cover;">
<p class="mt-2">Pace Breaker</p>
<button class="btn btn-outline-dark btn-sm">View</button>
</div>

<div class="col-lg-3 col-md-6 col-12">
<img src="https://cdn.cosmos.so/fa74abc3-a9ae-46f5-8060-a6830077536f?format=jpeg"
style="width:100%; height:300px; object-fit:cover;">
<p class="mt-2">Sweatpants</p>
<button class="btn btn-outline-dark btn-sm">View</button>
</div>

</div>
</div>

<!-- ================= FORM (ADDED but simple) ================= -->
<div class="container mt-5">
<form>
<input type="email" class="form-control mb-2" placeholder="Email">
<input type="password" class="form-control mb-2" placeholder="Password">
<button class="btn btn-dark btn-sm">Sign Up</button>
</form>
</div>

</body>
</html>
