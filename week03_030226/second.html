<!DOCTYPE html>
<html>
    <head>
        <title>Bootstrap</title>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    </head>
    <body style="background:#fff8e7; font-family:'Press Start 2P', cursive;">

<h1 class="text-center mt-5 mb-5" style="letter-spacing:2px;">
STRESS CALCULATOR
</h1>

<div class="container text-center">

  <div class="col-md-6 mx-auto p-5"
       style="border:4px solid black; background:white; box-shadow:6px 6px 0px black;">

    <!-- Inputs -->
    <input id="sleep" type="number" class="form-control mb-3" placeholder="Sleep Hours">

    <input id="assignments" type="number" class="form-control mb-3" placeholder="Assignments">

    <input id="study" type="number" class="form-control mb-4" placeholder="Study Hours">

    <!-- Button -->
    <button onclick="calculateStress()" class="btn btn-dark btn-lg w-100 mb-4">
      CALCULATE
    </button>

    <!-- Result -->
    <div id="result" style="letter-spacing:2px;"></div>

  </div>
</div>

<!-- JavaScript -->
<script>
function calculateStress() {

  let sleep = parseInt(document.getElementById("sleep").value) || 0;
  let assignments = parseInt(document.getElementById("assignments").value) || 0;
  let study = parseInt(document.getElementById("study").value) || 0;

  // Simple stress formula
  let stress = (assignments * 10 + study * 5 - sleep * 5);

  // limit 0–100
  stress = Math.max(0, Math.min(100, stress));

  let message = "";

  if (stress < 30) message = "YOU ARE CHILL 😎";
  else if (stress < 60) message = "MANAGEABLE 🙂";
  else if (stress < 85) message = "TAKE A BREAK 😬";
  else message = "GO SLEEP NOW 😭";

  document.getElementById("result").innerHTML =
    "STRESS: " + stress + "%<br><br>" + message;
}
</script>

</body>

</html>
